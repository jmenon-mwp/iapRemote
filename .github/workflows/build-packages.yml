name: Build Release Packages

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.1.3, etc.

env:
  VCPKG_CACHE_DIR: /tmp/vcpkg_cache

jobs:
  build-debian:
    name: Build Debian Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          # Extract tag name (e.g., refs/tags/v1.0.0 -> v1.0.0)
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create vcpkg cache directory
        run: |
          mkdir -p ${{ env.VCPKG_CACHE_DIR }}

      - name: Build Debian package
        run: |
          bash packaging/build_in_container.sh debian 11 ${{ steps.get_version.outputs.version }}

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: output/*.deb
          if-no-files-found: error

  build-ubuntu:
    name: Build Ubuntu Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create vcpkg cache directory
        run: |
          mkdir -p ${{ env.VCPKG_CACHE_DIR }}

      - name: Build Ubuntu package
        run: |
          bash packaging/build_in_container.sh ubuntu 20.04 ${{ steps.get_version.outputs.version }}

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-package
          path: output/*.deb
          if-no-files-found: error

  build-rocky:
    name: Build Rocky Linux Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create vcpkg cache directory
        run: |
          mkdir -p ${{ env.VCPKG_CACHE_DIR }}

      - name: Build Rocky Linux package
        run: |
          bash packaging/build_in_container.sh rocky 9 ${{ steps.get_version.outputs.version }}

      - name: Upload Rocky Linux package
        uses: actions/upload-artifact@v4
        with:
          name: rocky-package
          path: output/*.rpm
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-debian, build-ubuntu, build-rocky]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
          body: |
            ## iapRemote ${{ steps.get_version.outputs.version }}

            ### Installation

            #### Debian/Ubuntu
            Download the appropriate `.deb` file for your distribution and install with:
            ```bash
            sudo dpkg -i iapremote_${{ steps.get_version.outputs.version }}_*.deb
            sudo apt-get install -f  # Install any missing dependencies
            ```

            #### Rocky Linux/RHEL
            Download the appropriate `.rpm` file for your distribution and install with:
            ```bash
            sudo dnf install iapRemote-${{ steps.get_version.outputs.version }}-*.rpm
            ```

            ### Available Packages
            - Debian (built on Debian 11)
            - Ubuntu (built on Ubuntu 20.04)
            - Rocky Linux/RHEL (built on Rocky 9)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
