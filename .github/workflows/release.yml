name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-debian-ubuntu:
    runs-on: ubuntu-22.04
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Export GitHub Actions Cache Environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libgtkmm-3.0-dev libvte-2.91-dev libssl-dev dpkg-dev

      - name: Setup Vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: '9903b6088ef3914a840e94f31c19b015b63013d3' # Latest stable as of now

      - name: Run CMake with Vcpkg
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux
          cmake --build build -j$(nproc)
          cp build/iapRemote iapRemote-dynamic

      - name: Build Static Binary
        run: |
          cmake -B build_static -S . \
            -DSTATIC_BUILD=ON \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux
          cmake --build build_static -j$(nproc)
          cp build_static/iapRemote iapRemote-static

      - name: Build Debian & Ubuntu Packages
        run: |
          ./packaging/debian_dist/create_deb.sh
          ./packaging/ubuntu_dist/create_deb.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-ubuntu-artifacts
          path: |
            iapRemote-dynamic
            iapRemote-static
            packaging/debian_dist/*.deb
            packaging/ubuntu_dist/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container: rockylinux:9
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Build Tools
        run: |
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --set-enabled crb
          dnf install -y epel-release cmake gcc-c++ make pkgconfig rpm-build rpm-devel git curl zip unzip tar
          dnf install -y gtkmm30-devel vte291-devel openssl-devel

      - name: Setup Vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: '9903b6088ef3914a840e94f31c19b015b63013d3'

      - name: Build RPM Package
        run: |
          # Inject vcpkg toolchain into the create_rpm.sh process
          export EXTRA_CMAKE_FLAGS="-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          ./packaging/rpm_dist/create_rpm.sh

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-artifacts
          path: packaging/rpm_dist/rpmbuild/RPMS/x86_64/*.rpm

  publish-release:
    needs: [build-debian-ubuntu, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten directory structure
        run: |
          mkdir -p release_assets
          find artifacts -type f -exec cp {} release_assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
