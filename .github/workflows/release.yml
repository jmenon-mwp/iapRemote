name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-debian-ubuntu:
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libgtkmm-3.0-dev libvte-2.91-dev libssl-dev nlohmann-json3-dev libgoogle-cloud-cpp-dev dpkg-dev

      - name: Build Binaries
        run: |
          mkdir -p build && cmake -B build -S . && cmake --build build -j$(nproc)
          cp build/iapRemote iapRemote-dynamic
          mkdir -p build_static && cmake -B build_static -S . -DSTATIC_BUILD=ON && cmake --build build_static -j$(nproc)
          cp build_static/iapRemote iapRemote-static

      - name: Build Debian & Ubuntu Packages
        run: |
          ./packaging/debian_dist/create_deb.sh
          ./packaging/ubuntu_dist/create_deb.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-ubuntu-artifacts
          path: |
            iapRemote-dynamic
            iapRemote-static
            packaging/debian_dist/*.deb
            packaging/ubuntu_dist/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf install -y cmake gcc-c++ make pkgconfig rpm-build rpm-devel
          dnf install -y gtkmm30-devel vte291-devel openssl-devel nlohmann-json-devel

      - name: Build RPM Package
        run: |
          # The script will now run in a native Rocky environment
          ./packaging/rpm_dist/create_rpm.sh

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-artifacts
          path: packaging/rpm_dist/rpmbuild/RPMS/x86_64/*.rpm

  publish-release:
    needs: [build-debian-ubuntu, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten directory structure
        run: |
          mkdir -p release_assets
          find artifacts -type f -exec cp {} release_assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
